onboarding = false

[keys]
prefix = "ctrl+x"
new_tab = "prefix+t"
split_vertical = "prefix+/"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "s4kr4.fuzzy-jump.open"
description = "fuzzy jump to tab/pane"

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", fg = "#bbbbbb" }, "state_text"],
  [{ token = "terminal_title_stripped", fg = "#eeeeee" }]
]

[ui.toast]
delivery = "off"

[theme]
name = "catppuccin"
auto_switch = false
